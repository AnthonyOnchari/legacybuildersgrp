<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Legacy Builders Group · Maintenance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 1.5rem;
            overflow: hidden;
        }

        .card {
            background: linear-gradient(145deg, #ffffff 0%, #f8fafc 100%);
            border-radius: 2.5rem;
            padding: 2.5rem 2rem;
            max-width: 440px;
            width: 100%;
            text-align: center;
            position: relative;
            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Colorful top accent bar */
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 20%;
            right: 20%;
            height: 4px;
            border-radius: 0 0 10px 10px;
            background: linear-gradient(90deg, #f59e0b, #10b981, #3b82f6, #ef4444, #a855f7);
            background-size: 200% 100%;
            animation: rainbowSlide 3s linear infinite;
        }

        @keyframes rainbowSlide {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 200% 50%;
            }
        }

        .emoji {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: bounce 1.5s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.4rem;
            letter-spacing: -0.3px;
        }

        .sub {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .status-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .pill {
            padding: 0.35rem 1rem;
            border-radius: 2rem;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .pill-yellow {
            background: #fef3c7;
            color: #92400e;
        }
        .pill-green {
            background: #d1fae5;
            color: #065f46;
        }
        .pill-blue {
            background: #dbeafe;
            color: #1e40af;
        }

        .loader-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin: 1rem 0 1.5rem;
        }

        .bar {
            width: 8px;
            height: 28px;
            border-radius: 8px;
            animation: loaderBar 1s infinite ease-in-out;
        }

        .bar:nth-child(1) {
            background: #f59e0b;
            animation-delay: 0s;
        }
        .bar:nth-child(2) {
            background: #10b981;
            animation-delay: 0.15s;
        }
        .bar:nth-child(3) {
            background: #3b82f6;
            animation-delay: 0.3s;
        }
        .bar:nth-child(4) {
            background: #ef4444;
            animation-delay: 0.45s;
        }

        @keyframes loaderBar {
            0%,
            100% {
                height: 28px;
            }
            50% {
                height: 12px;
            }
        }

        .time-badge {
            display: inline-block;
            background: #1e293b;
            color: #ffd966;
            padding: 0.5rem 1.4rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        .contact {
            margin-top: 1.5rem;
            padding-top: 1.2rem;
            border-top: 1px solid #e2e8f0;
            font-size: 0.8rem;
            color: #64748b;
        }

        .contact strong {
            color: #1e293b;
        }

        .brand {
            margin-top: 0.8rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
        }

        @media (max-width: 400px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 1.5rem;
            }
            .emoji {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🛠️</div>
        <h1>We'll be right back</h1>
        <p class="sub">Legacy Builders Group is getting a quick refresh</p>

        <div class="status-pills">
            <span class="pill pill-yellow">💰 Savings</span>
            <span class="pill pill-green">💸 Loans</span>
            <span class="pill pill-blue">📊 Reports</span>
        </div>

        <div class="loader-row">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <div class="time-badge">⏳ Back by 10:00 PM EAT</div>

        <div class="contact">
            📞 Questions? Call <strong>Mrs. Kithinji</strong>
        </div>

        <div class="brand">🏛️ Stronger Together · Richer Forever</div>
    </div>
</body>
</html>
